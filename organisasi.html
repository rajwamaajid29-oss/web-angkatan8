<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090c12">
  <title>Organisasi OSIS · GENERATION X8</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&family=Bebas+Neue&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="organisasi">
<main>

  <!-- Page Header -->
  <section class="phead tint">
    <div class="wrap">
      <span class="sub-badge">Kepemimpinan Santri</span>
      <h1>Struktur Organisasi OSIS</h1>
      <p class="intro">Amanah khidmah santri GENERATION X8 dalam mengawal dakwah, kedisiplinan, dan kegiatan asrama.</p>
    </div>
  </section>

  <!-- Pilih Organisasi -->
  <section class="sec light" id="orgPicker">
    <div class="wrap">
      <div class="org-cards" id="orgCards"></div>
    </div>
  </section>

  <!-- Struktur (muncul setelah card dipilih) -->
  <section class="sec light" id="orgDetail" hidden>
    <div class="wrap">
      <button class="org-back" id="orgBack" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        Kembali
      </button>
      <header class="org-overview">
        <h2 id="orgJudul"></h2>
        <p id="orgDesc"></p>
      </header>
      <div class="otree-scroll"><div class="otree" id="orgTree"></div></div>
    </div>
  </section>

</main>

<script src="js/data/img.js"></script>
<script src="js/data/angkatan.js"></script>
<script src="js/data/waliKelas.js"></script>
<script src="js/data/osis.js"></script>
<script src="js/data/santri.js"></script>
<script src="js/data/santriwati.js"></script>
<script src="js/data/prestasi.js"></script>
<script src="js/data/galeri.js"></script>
<script src="js/common.js"></script>
<script src="js/organisasi.js"></script>
</body>
</html>
