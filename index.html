<!doctype html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000000"><title>Website Angkatan</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,600;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body data-page="home"><main>
<section id="home" class="hero"><div id="slides"></div><div class="shade"></div>
  <canvas id="dust" aria-hidden="true"></canvas>
  <div class="hero-txt">
    <p class="badge" id="hMeta"></p>
    <h1 id="hNama"></h1>
    <p class="tag"><span id="hTag"></span><br><span id="hSub"></span></p>
    <div class="social" id="hSocial"></div>
    <div class="hstats" id="hStats"></div>
  </div>
  <a class="scroll" href="#tentang">Scroll</a>
  <div class="dots" id="dots"></div></section>

<div class="marquee" id="marquee" aria-hidden="true"></div>

<section id="tentang" class="sec light"><div class="wrap about">
  <div class="about-img"><img id="ft1" alt=""><img id="ft2" alt=""></div>
  <div><h2>Tentang angkatan kami</h2><div id="cerita"></div>
  </div>
</div></section>

<section id="perjalanan" class="sec tint"><div class="wrap"><h2>Perjalanan kami</h2>
  <div class="timeline" id="timeline"></div></div></section>

<section id="wali" class="sec light"><div class="wrap"><h2>Wali kelas</h2><div class="grid3" id="waliGrid"></div></div></section>

<section id="anggota" class="sec tint"><div class="wrap"><h2>Keluarga angkatan</h2>
  <div class="tools"><div class="tabs"><button class="on" data-t="putra">Santri (Putra)</button><button data-t="putri">Santriwati (Putri)</button></div>
  <div class="find"><input id="q" placeholder="Cari nama" aria-label="Cari nama"><select id="kelas" aria-label="Filter kelas"></select></div></div>
  <p class="count" id="count"></p><div class="grid6" id="members"></div></div></section>

<section id="galeri-preview" class="sec light"><div class="wrap"><h2>Sekilas galeri</h2>
  <div class="masonry" id="gGrid"></div><div class="center"><a href="galeri.html" class="btn solid">Lihat semua galeri</a></div></div></section>
</main>
<script src="js/data/img.js"></script><script src="js/data/angkatan.js"></script><script src="js/data/waliKelas.js"></script><script src="js/data/osis.js"></script><script src="js/data/santri.js"></script><script src="js/data/santriwati.js"></script><script src="js/data/prestasi.js"></script><script src="js/data/galeri.js"></script><script src="js/common.js"></script><script src="js/home.js"></script></body></html>
